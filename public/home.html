<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container" style="max-width: 500px; text-align: center;">
        <h2>🎉 Welcome to the Dashboard!</h2>
        <p>You have successfully verified your credentials against the MySQL database.</p>
        <p style="margin-top: 20px;"><strong>Status:</strong> Authenticated Secure Session ✅</p>
        <button id="logoutBtn" style="background-color: #dc3545; margin-top: 20px;">Log Out</button>
    </div>

    <script>
        // Simple logout routing logic
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            const response = await fetch('/api/logout', { method: 'POST' });
            if (response.ok) {
                window.location.href = '/index.html';
            }
        });
    </script>
</body>
</html>
