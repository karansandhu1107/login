<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full-Stack Auth (MySQL)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <!-- LOGIN VIEW -->
        <div id="loginSection">
            <h2>Welcome Back</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit">Login</button>
                <p>Don't have an account? <a href="#" id="showRegister">Create User</a></p>
                <p id="errorMessage" class="error-msg"></p>
            </form>
        </div>

        <!-- REGISTER VIEW (Hidden by default using standard CSS workflow) -->
        <div id="registerSection" style="display: none;">
            <h2>Create New User</h2>
            <form id="registerForm">
                <div class="input-group">
                    <label for="regUsername">Choose Username</label>
                    <input type="text" id="regUsername" required autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="regPassword">Choose Password</label>
                    <input type="password" id="regPassword" required>
                </div>
                <button type="submit" style="background-color: #28a745;">Sign Up</button>
                <p>Already have an account? <a href="#" id="showLogin">Back to Login</a></p>
                <p id="regMessage" class="error-msg"></p>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
